<script>
// ───────── 語言：中文＋英文（預設）／中文＋日文（?lang=ja） ─────────
const q = new URLSearchParams(location.search);
let LANG = q.get('lang') === 'ja' ? 'ja' : 'en';
const T = {

    'Out the temple gate, the bearers turn and stop as Mazu wills. No one knows which way the next corner will go.',
    '廟の門を出ると、担ぎ手は媽祖の意のままに向きを変え、立ち止まる。次の角をどちらへ曲がるか、誰にも分からない。'],

const nodeM = name => NODES.find(n => n.name === name).m;

const SEG = [

  [58, 70, nodeM('中華賓士員林展示中心'), '4/14', 2],
  [70.5, 76.5, nodeM('虎尾帥興宮'), '4/15', 3],
  [77, 81.5, nodeM('元長客厝'), '4/16', 4],
  [82, 85.5, M_BEIGANG, '4/17', 5],
  [89, 95.5, nodeM('溪湖福安宮'), '4/17', 5],

  [104, 109.5, M_END, '4/20', 8],
];
const WD = { '4/13': '一', '4/14': '二', '4/15': '三', '4/16': '四', '4/17': '五', '4/18–19': '六・日', '4/20': '一' };
function routeAt(t) { // 回傳 { m, seg }
  let m = 0, seg = SEG[0];
  for (const s of SEG) { if (t >= s[0]) { seg = s; const prev = SEG[SEG.indexOf(s) - 1]; const m0 = prev ? prev[2] : 0;
    m = m0 + (s[2] - m0) * ease(clamp((t - s[0]) / (s[1] - s[0]))); } }
  return { m, seg };
}
// 畫面里程換算成 GPS 紀錄（去程 143.2、回程 137.1 公里）
const gpsKm = m => m <= M_BEIGANG ? m / M_BEIGANG * 143.2 : 143.2 + (m - M_BEIGANG) / (M_END - M_BEIGANG) * 137.1;
function pointAt(m) {
  let lo = 0, hi = ROUTE_M.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (ROUTE_M[mid] <= m) lo = mid; else hi = mid; }
  const r = (m - ROUTE_M[lo]) / Math.max(1, ROUTE_M[hi] - ROUTE_M[lo]);
  return { i: lo, ll: [ROUTE[lo][0] + (ROUTE[hi][0] - ROUTE[lo][0]) * r, ROUTE[lo][1] + (ROUTE[hi][1] - ROUTE[lo][1]) * r] };
}
function slice(m0, m1) {
  if (m1 <= m0) return null;
  const a = pointAt(m0), b = pointAt(m1);
  return [a.ll, ...ROUTE.slice(a.i + 1, b.i + 1), b.ll];
}

// ───────── 鏡頭 ─────────
const GT = [120.7090, 24.5714], CT = [120.30468, 23.56810];
// 關鍵格：[t, lng, lat, zoom, pitch, bearing]；路線段（46–110）改為跟著粉紅超跑
const CAM = [
  [0,   120.95, 23.70, 7.0, 0, 0],
  [7,   120.95, 23.70, 7.0, 0, 0],
  [13,  120.712, 24.566, 13.6, 50, -10],
  [20,  120.7095, 24.5705, 15.6, 58, 0],
  [33,  120.7092, 24.5708, 16.0, 60, 18],
  [44,  120.7085, 24.5650, 13.4, 50, 10],
];
const CAM_END = [
  [110, 120.90, 24.06, 9.3, 25, 0],
  [148, 120.90, 24.06, 9.25, 25, 0],
];
const CAM_END_P = [
  [110, 120.55, 24.22, 9.4, 20, 0],
  [148, 120.55, 24.22, 9.35, 20, 0],
];
const FOLLOW_Z = [[46, 13.2], [57, 13.0], [60, 12.6], [70, 12.4], [77, 12.2], [83, 12.8], [88, 12.8], [92, 12.2], [97, 11.4], [103, 11.6], [107, 12.6]];
function interp(K, t, idx) { let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++; const A = K[i], B = K[i + 1]; const s = ease(clamp((t - A[0]) / (B[0] - A[0]))); return A[idx] + (B[idx] - A[idx]) * s; }
function keyCam(K, t) {
  return { center: [interp(K, t, 1), interp(K, t, 2)], zoom: interp(K, t, 3), pitch: interp(K, t, 4), bearing: interp(K, t, 5) };
}
function followCam(t) {
  let x = 0, y = 0; const n = 7;
  for (let k = 0; k < n; k++) { const p = pointAt(routeAt(t - 1.2 + k * 0.4).m).ll; x += p[0]; y += p[1]; }
  return { center: [x / n, y / n], zoom: interp(FOLLOW_Z.map(([a, z]) => [a, 0, 0, z]), t, 3), pitch: 48, bearing: 0 };
}
function camAt(t) {
  const mix = (A, B, s) => ({ center: [A.center[0] + (B.center[0] - A.center[0]) * s, A.center[1] + (B.center[1] - A.center[1]) * s],
    zoom: A.zoom + (B.zoom - A.zoom) * s, pitch: A.pitch + (B.pitch - A.pitch) * s, bearing: A.bearing + (B.bearing - A.bearing) * s });
  if (t < 44) return keyCam(CAM, t);
  if (t < 47) return mix(keyCam(CAM, 44), followCam(t), ease((t - 44) / 3));
  if (t < 108) return followCam(t);
  const E = PORT ? CAM_END_P : CAM_END;
  if (t < 112) return mix(followCam(t), keyCam(E, t), ease((t - 108) / 4));
  return keyCam(E, t);
}

// ───────── 圖釘：[id, 經緯度, 插圖, 中文, 英文, 日文, 起, 迄, 大小, 水平位移] ─────────
const PINS = [
  ['pgt', GT, 'gongtian', '白沙屯拱天宮', 'Baishatun Gongtian Temple', '白沙屯拱天宮', 14, 46, 1, -230],
  ['pdj', NODES.find(n => n.name === '大甲鎮瀾宮').ll, '', '大甲鎮瀾宮', 'Dajia Jenn Lann Temple', '大甲鎮瀾宮', 50, 58, 1, 220],
  ['pfac', NODES.find(n => n.name === '福懋油脂股份有限公司').ll, 'factory', '工廠', 'Factory', '工場', 60, 66, .8, -170],
  ['phos', NODES.find(n => n.name === '秀傳紀念醫院').ll, 'hospital', '醫院', 'Hospital', '病院', 61.5, 67.5, .8, 170],
  ['pbenz', NODES.find(n => n.name === '中華賓士員林展示中心').ll, 'car', '賓士展示中心', 'Benz showroom', 'ベンツのショールーム', 63.5, 70.5, .8, 200],
  ['pct', CT, 'chaotian', '北港朝天宮', 'Beigang Chaotian Temple', '北港朝天宮', 83.5, 90, 1, -250],
  ['pfire', CT, 'urn', '', '', '', 85.5, 89.5, 1, 230],
  ['pxh', NODES.find(n => n.name === '溪湖福安宮').ll, '', '溪湖福安宮', 'Xihu Fu’an Temple', '渓湖福安宮', 93, 96.5, 1, 220],
  ['pgt2', GT, 'gongtian', '白沙屯拱天宮', 'Baishatun Gongtian Temple', '白沙屯拱天宮', 107, 112, 1, -230],
  ['psnack', [120.62, 24.00], 'snack', '', '', '', 122.5, 128.5, .8, -120],
  ['pwalk', [120.62, 24.00], 'pilgrims', '', '', '', 122.8, 128.5, .8, 140],
];

// ───────── 小工具 ─────────
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const fade = (t, a, b, f = .6) => clamp(Math.min((t - a) / f, (b - t) / f));
const DUR = 148;

// ───────── 版面 ─────────
const PORT = q.has('portrait') || (!q.has('landscape') && innerHeight > innerWidth);
if (PORT) document.documentElement.classList.add('port');
if (q.has('capture')) document.documentElement.classList.add('capture');
const [SW, SH] = PORT ? [1080, 1920] : [1920, 1080];
const stage = document.getElementById('stage');
const fit = () => {
  if (!q.has('portrait') && !q.has('landscape') && (innerHeight > innerWidth) !== PORT) return location.reload();
  const k = Math.min(innerWidth / SW, innerHeight / SH);
  stage.style.transform = `translate(${(innerWidth - SW * k) / 2}px, ${(innerHeight - SH * k) / 2}px) scale(${k})`;
};
addEventListener('resize', fit); fit();
const PORT_ZOOM = -0.6, PORT_PAD = { top: 0, left: 0, right: 0, bottom: 560 };

// ───────── 地圖 ─────────
const map = new maplibregl.Map({
  container: 'map', center: [CAM[0][1], CAM[0][2]], zoom: CAM[0][3], interactive: false,
  attributionControl: false, fadeDuration: 0, maxPitch: 75,
  canvasContextAttributes: { preserveDrawingBuffer: true, antialias: true },
  style: {
    version: 8,
    sources: {
      photo: { type: 'raster', tileSize: 256, maxzoom: 19, tiles: ['https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/GoogleMapsCompatible/{z}/{y}/{x}'] },
      dem: { type: 'raster-dem', encoding: 'terrarium', tileSize: 256, maxzoom: 15, tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'] },
    },
    sky: { 'sky-color': '#9cc7e8', 'horizon-color': '#f3e6c8', 'fog-color': '#e9dcc0', 'sky-horizon-blend': .6, 'horizon-fog-blend': .5, 'fog-ground-blend': .75, 'atmosphere-blend': .8 },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#1f3a4d' } },
      { id: 'hill0', type: 'hillshade', source: 'dem', paint: { 'hillshade-exaggeration': 0.5, 'hillshade-shadow-color': '#16222b', 'hillshade-highlight-color': '#5d7a8a' } },
      { id: 'photo', type: 'raster', source: 'photo', paint: { 'raster-saturation': -0.15, 'raster-contrast': 0.05, 'raster-brightness-max': 0.93 } },
      { id: 'hill', type: 'hillshade', source: 'dem', paint: { 'hillshade-exaggeration': 0.2, 'hillshade-shadow-color': '#2b2620' } },
    ],
  },
  terrain: { source: 'dem', exaggeration: 1.5 },
});
const lineGeo = c => ({ type: 'Feature', geometry: { type: 'LineString', coordinates: c || [[0, 0], [0, 0]] } });
map.on('load', () => {
  for (const [id, col] of [['out', '#e8649b'], ['ret', '#f08a3c']]) {
    map.addSource(id, { type: 'geojson', data: lineGeo() });
    map.addLayer({ id: id + '-case', type: 'line', source: id, layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#fbf5e6', 'line-width': ['interpolate', ['linear'], ['zoom'], 8, 5, 13, 11], 'line-opacity': .9 } });
    map.addLayer({ id, type: 'line', source: id, layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': col, 'line-width': ['interpolate', ['linear'], ['zoom'], 8, 3, 13, 7] } });
  }
  window.mapReady = true;
});

// ───────── DOM ─────────
const pinBox = document.getElementById('pins');
for (const [id, , a, zh] of PINS) {
  const d = document.createElement('div'); d.className = 'pin'; d.id = id;
  d.innerHTML = art(a) + (zh ? `<div class="stem"></div><div class="tag"><b>${zh}</b><i></i></div>` : '');
  pinBox.appendChild(d);
}
const sedan = document.createElement('div'); sedan.className = 'pin'; sedan.id = 'sedan'; sedan.innerHTML = art('sedan'); pinBox.appendChild(sedan);
const YEARS = [[2017, 26669], [2018, 43205], [2019, 50001], [2020, 54599], [2021, 78672], [2022, 90928], [2023, 113621], [2024, 179971], [2025, 329118], [2026, 463588]];
document.getElementById('bars').innerHTML = YEARS.map(([y, v]) => `<div class="b"><div class="v">${(v / 10000).toFixed(1)}萬</div><div class="bar" data-v="${v}"></div><div class="y">${String(y).slice(2)}</div></div>`).join('');

function applyLang() {
  const L = LANG === 'ja' ? 2 : 1;
  document.documentElement.classList.toggle('ja', LANG === 'ja');
  document.getElementById('hook').querySelector('.t1').innerHTML = T.hook[0];
  document.getElementById('hook').querySelector('.t2').textContent = T.hook[L];
  document.querySelectorAll('[data-sub]').forEach(e => e.textContent = T[e.dataset.sub][L]);
  for (const p of PINS) { const i = document.querySelector('#' + p[0] + ' .tag i'); if (i) i.textContent = p[3 + L]; }
  document.getElementById('lang').textContent = LANG === 'ja' ? 'English' : '日本語';
  document.getElementById('card').dataset.k = '';
}
applyLang();

// ───────── 每格繪製 ─────────
let lastM = -1;
function draw(t) {
  const cam = camAt(t);
  if (PORT) { const k = ease(clamp((t - 7) / 6)); cam.zoom += PORT_ZOOM * k; cam.padding = { ...PORT_PAD, bottom: PORT_PAD.bottom * k }; }
  map.jumpTo(cam);

  const { m, seg } = routeAt(t);
  const mr = Math.round(m / 20) * 20;
  if (mr !== lastM && map.getSource('out')) {
    lastM = mr;
    map.getSource('out').setData(lineGeo(slice(0, Math.min(mr, M_BEIGANG))));
    map.getSource('ret').setData(lineGeo(slice(M_BEIGANG, mr)));
  }

  // 粉紅超跑：拱天宮出場（26 秒），沿路線前進，回宮後淡出
  const sp = pointAt(m).ll, so = fade(t, 26, 112, .6);
  if (so > 0) { const pt = map.project(sp); sedan.style.opacity = so;
    sedan.style.transform = `translate(${pt.x - sedan.offsetWidth / 2}px, ${pt.y - sedan.offsetHeight}px) scale(${0.6 + 0.4 * ease(clamp((t - 26) / .6))})`; }
  else sedan.style.opacity = 0;

  for (const [id, ll, , , , , a, b, sc, dx = 0] of PINS) {
    const el = document.getElementById(id), o = fade(t, a, b, .5);
    if (o <= 0) { el.style.opacity = 0; continue; }
    const pt = map.project(ll), pop = 0.6 + 0.4 * ease(clamp((t - a) / .5));
    el.style.opacity = o;
    el.style.transform = `translate(${pt.x - el.offsetWidth / 2 + dx}px, ${pt.y - el.offsetHeight}px) scale(${sc * pop})`;
  }

  const L = LANG === 'ja' ? 4 : 3;
  const card = document.getElementById('card'); let shown = false;
  for (const c of CARDS) {
    const [a, b, zh] = c;
    if (t >= a - .01 && t <= b) {
      if (card.dataset.k !== String(a)) { card.dataset.k = a; card.querySelector('.zh').innerHTML = zh; card.querySelector('.sub').textContent = c[L]; }
      const o = fade(t, a, b, .45); card.style.opacity = o; card.style.transform = `translateY(${(1 - o) * 24}px)`; shown = true;
    }
  }
  if (!shown) card.style.opacity = 0;

  const hud = document.getElementById('hud'), ho = fade(t, 46, 111, .6);
  hud.style.opacity = ho;
  if (ho > 0) {
    const d = seg[4], date = seg[3];
    hud.querySelector('.day').innerHTML = LANG === 'ja' ? `${d}日目 ${date}` : `第 ${d} 天 ${date}（${WD[date]}）<small>Day ${d}</small>`;
    const km = Math.round(gpsKm(m));
    hud.querySelector('.km').innerHTML = LANG === 'ja' ? `${km} キロ` : `${km} 公里<small>km</small>`;
  }

  const ch = document.getElementById('chart'), co = fade(t, 115, 128.3, .6);
  ch.style.opacity = co;
  if (co > 0) document.querySelectorAll('#bars .bar').forEach((b, i) => {
    const g = ease(clamp((t - 115.6 - i * 0.25) / 1.2));
    b.style.height = (b.dataset.v / 463588 * 250 * g) + 'px';
  });

  document.getElementById('hook').style.opacity = fade(t, 1.2, 7.2, .8);
  document.getElementById('title').style.opacity = fade(t, 7.6, 13.4, .8);
  const endO = fade(t, 141.3, 300, .9);
  document.getElementById('ending').style.opacity = endO;
  document.getElementById('links').style.visibility = endO > .5 ? 'visible' : 'hidden';
}

// ───────── 播放 ─────────
window.seek = t => new Promise(res => { draw(t); map.once('idle', () => requestAnimationFrame(() => res())); map.triggerRepaint(); });
window.DUR = DUR;
document.getElementById('lang').onclick = () => { LANG = LANG === 'ja' ? 'en' : 'ja'; applyLang(); };
map.on('load', () => {
  if (q.has('capture')) return;
  if (q.has('t')) { seek(+q.get('t')); return; }
  const PICK = !q.has('lang');
  let t0 = performance.now(), pausedAt = PICK ? t0 : null;  // 有開場選單時先停在第 0 秒
  const now = () => ((pausedAt ?? performance.now()) - t0) / 1000;
  const pp = document.getElementById('pp');
  // 配樂：瀏覽器不准自動播放有聲音的媒體，按鈕開啟後對齊目前時間
  const bgm = document.getElementById('bgm'), snd = document.getElementById('snd');
  const setPause = p => {
    if (p && pausedAt === null) { pausedAt = performance.now(); bgm.pause(); pp.textContent = '▶ 繼續'; }
    else if (!p && pausedAt !== null) {
      t0 += performance.now() - pausedAt; pausedAt = null; pp.textContent = '❚❚ 暫停';
      if (snd.dataset.on && now() < DUR) { bgm.currentTime = now(); bgm.play(); }
    }
  };
  snd.onclick = () => {
    if (!snd.dataset.on) { if (now() < DUR && pausedAt === null) { bgm.currentTime = now(); bgm.play(); } snd.textContent = '♪ 關閉音樂'; snd.dataset.on = 1; }
    else { bgm.pause(); snd.textContent = '♪ 開啟音樂'; delete snd.dataset.on; }
  };
  pp.onclick = () => setPause(pausedAt === null);
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); setPause(pausedAt === null); } });
  document.getElementById('replay').onclick = () => {
    t0 = performance.now(); pausedAt = null; pp.textContent = '❚❚ 暫停';
    if (snd.dataset.on) { bgm.currentTime = 0; bgm.play(); }
  };
  if (PICK) {
    const st = document.getElementById('start'); st.style.display = 'flex';
    st.querySelectorAll('button').forEach(b => b.onclick = () => {
      LANG = b.dataset.lang; applyLang(); st.style.display = 'none';
      t0 = performance.now(); pausedAt = null; snd.click();
    });
  }
  const loop = () => { draw(Math.min(now(), DUR)); requestAnimationFrame(loop); };
  loop();
});
</script>
</body>
</html>
